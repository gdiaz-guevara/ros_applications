# Inverse kinematics (IK) solver per planning group.
# The NAO arms have only 5 joints, so they cannot reach an arbitrary 6D pose
# (position + orientation). position_only_ik asks KDL to match the POSITION
# of the hand and ignore its orientation.
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
